global:
  scrape_interval: 15s
scrape_configs:
  - job_name: demo-app
    static_configs:
      - targets: ["demo-app:8001"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: demo-availability
    metrics_path: /probe/demo
    scrape_timeout: 8s
    static_configs:
      - targets: ["probe-gateway:9116"]
        labels:
          instance: demo-app-health
  - job_name: otlp
    sample_limit: 20000
    label_limit: 32
    label_name_length_limit: 128
    label_value_length_limit: 256
    static_configs:
      - targets: ["collector:8889"]
