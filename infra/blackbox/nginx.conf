worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 9116;
        server_tokens off;
        client_max_body_size 1k;
        location = /healthz { return 200 "ok\n"; }
        # This fixed route is the entire allowlist. Never forward user URLs or headers.
        location = /probe/demo {
            if ($request_method != GET) { return 405; }
            if ($is_args != "") { return 400; }
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host localhost;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 7s;
            proxy_pass http://127.0.0.1:9115/probe?module=demo_health&target=http%3A%2F%2Fdemo-app%3A8001%2Fhealthz;
        }
        location / { return 404; }
    }
}
