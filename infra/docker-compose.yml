name: opsdetective
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SECURE_COOKIES: "false"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('redis',6379),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  demo-app:
    build:
      context: ..
      dockerfile: services/demo-app/Dockerfile
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: [CMD, /otelcol-contrib, --version]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  prometheus:
    image: prom/prometheus:v3.3.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      demo-app: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/prometheus, --version]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
networks:
  private:
