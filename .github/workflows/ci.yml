name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements-dev.txt
      - run: ruff check services/api services/demo-app services/gateway scripts/compose-revocation.py
      - run: PYTHONPATH=services/api SESSION_SECRET=test-session-key-only pytest -q services/api/tests
      - run: pip install -r services/gateway/requirements.txt
      - run: pytest -q services/gateway/tests
      - run: python -m compileall -q services
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
      - run: bash scripts/create-test-env.sh "$RUNNER_TEMP/opsdetective-ci.env"
      - run: docker compose --env-file "$RUNNER_TEMP/opsdetective-ci.env" -f infra/docker-compose.yml -p opsdetective-ci up --build -d --wait --wait-timeout 180 postgres api collector gateway
      - run: docker compose --env-file "$RUNNER_TEMP/opsdetective-ci.env" -f infra/docker-compose.yml -p opsdetective-ci exec -T api python - < scripts/compose-revocation.py
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/opsdetective-ci.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/opsdetective-ci.env" -f infra/docker-compose.yml -p opsdetective-ci down -v
            rm -f "$RUNNER_TEMP/opsdetective-ci.env"
          fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
